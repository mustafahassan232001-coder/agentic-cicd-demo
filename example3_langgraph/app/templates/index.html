<!DOCTYPE html>
<html>
<head>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <title>Expense Tracker</title>
</head>
<body>
    <h1>Dashboard</h1>
    <div class="total">Total: ${{ "%.2f"|format(total) }}</div>

    <form action="/add" method="POST">
        <input type="number" step="0.01" name="amount" placeholder="Amount" required>
        <input type="text" name="category" placeholder="Category" required>
        <input type="text" name="description" placeholder="Description" required>
        <input type="date" name="date" required>
        <button type="submit">Add Expense</button>
    </form>

    <form action="/" method="GET">
        <input type="text" name="category" placeholder="Filter by category" value="{{ selected_category or '' }}">
        <button type="submit">Filter</button>
        <a href="/">Clear</a>
    </form>

    <table>
        <tr><th>Amount</th><th>Category</th><th>Description</th><th>Date</th><th>Actions</th></tr>
        {% for e in expenses %}
        <tr>
            <form action="/edit/{{ e.id }}" method="POST">
                <td><input type="number" step="0.01" name="amount" value="{{ e.amount }}"></td>
                <td><input type="text" name="category" value="{{ e.category }}"></td>
                <td><input type="text" name="description" value="{{ e.description }}"></td>
                <td>{{ e.date.strftime('%Y-%m-%d') }}</td>
                <td><button type="submit">Save</button> <a href="/delete/{{ e.id }}">Delete</a></td>
            </form>
        </tr>
        {% endfor %}
    </table>
</body>
</html>
