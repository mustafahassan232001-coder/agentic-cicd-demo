{% extends 'base.html' %}{% block content %}<h2>Tasks</h2><form action='/add' method='POST'><input name='content' placeholder='New Task' required><button type='submit'>Add</button></form><ul>{% for task in tasks %}<li>{{ task.content }} <a href='/delete/{{ task.id }}'>Delete</a></li>{% endfor %}</ul><a href='/logout'>Logout</a>{% endblock %}
